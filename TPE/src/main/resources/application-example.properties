# Exemple de configuration sans secrets
spring.application.name=TPE

# Groq API Key via variable d'environnement
groq.api.key=${GROQ_API_KEY:}

# Database example
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TPE_DB;encrypt=false
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
