<div class="powerbi-container">
  <!-- Loader -->
  <div *ngIf="loading" class="powerbi-loading">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">Chargement du rapport Power BI...</span>
    </div>
    <p class="mt-3">Chargement du rapport Power BI...</p>
  </div>

  <!-- Erreur -->
  <div *ngIf="error" class="alert alert-danger" role="alert">
    <i class="material-icons">error_outline</i>
    {{ error }}
  </div>

  <!-- Actions toolbar -->
  <div class="powerbi-toolbar" *ngIf="!loading && !error">
    <button class="btn btn-sm btn-primary" (click)="refresh()" title="Actualiser">
      <i class="material-icons">refresh</i>
    </button>
    <button class="btn btn-sm btn-primary" (click)="fullscreen()" title="Plein écran">
      <i class="material-icons">fullscreen</i>
    </button>
  </div>

  <!-- Container pour le rapport Power BI -->
  <div #reportContainer class="powerbi-report-container"></div>
</div>
