<div class="powerbi-public-container">
  <!-- Loader -->
  <div *ngIf="loading" class="powerbi-loading">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">Chargement du rapport Power BI...</span>
    </div>
    <p class="mt-3">Chargement du rapport Power BI...</p>
  </div>

  <!-- Erreur -->
  <div *ngIf="error" class="alert alert-warning" role="alert">
    <i class="material-icons">info</i>
    {{ error }}
    <br>
    <small>Pour afficher le rapport ici, publiez-le sur le web depuis Power BI Service.</small>
  </div>

  <!-- Iframe Power BI Public -->
  <iframe 
    *ngIf="safeUrl && !error"
    [src]="safeUrl"
    [style.width]="width"
    [style.height]="height"
    (load)="onLoad()"
    (error)="onError()"
    frameborder="0"
    allowFullScreen="true">
  </iframe>
</div>
